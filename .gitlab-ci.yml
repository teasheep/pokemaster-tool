# GitLab CI: 每次 push / MR 跑 lint + 型別檢查 + 測試 + build (四個 job 並行)
# 免費方案共享 runner 每月 400 分鐘; 不夠可掛 self-hosted runner (Settings > CI/CD > Runners)

image: node:24

stages:
  - check

default:
  interruptible: true # 同分支有新 push 時自動取消舊 pipeline, 省額度
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  NEXT_TELEMETRY_DISABLED: "1"

lint:
  stage: check
  script:
    - npm run lint

typecheck:
  stage: check
  script:
    - npx tsc --noEmit

test:
  stage: check
  script:
    - npm test

build:
  stage: check
  script:
    - npm run build
  # Supabase env 不需要: 未設定時 app 走 stub client, 頁面皆為動態渲染不會在 build 期打 DB
